# InstallHub suite home page: plain static files, no build step.
[build]
  publish = "."

# Short links: installhub.org/safeinstall and installhub.org/techmate
[[redirects]]
  from = "/safeinstall"
  to = "https://safeinstall.org"
  status = 302

[[redirects]]
  from = "/techmate"
  to = "https://techmate.installhub.org"
  status = 302

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
