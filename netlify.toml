# InstallHub suite home page: plain static files, no build step.
[build]
  publish = "."

# Internal notes (deploy policy, brand guide) live in docs/ and must never be served.
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

# Short links: installhub.org/safeinstall, /safetradie and /techmate
[[redirects]]
  from = "/safeinstall"
  to = "https://safeinstall.org"
  status = 302

[[redirects]]
  from = "/safetradie"
  to = "https://safetradie.installhub.org"
  status = 302

[[redirects]]
  from = "/techmate"
  to = "https://techmate.installhub.org"
  status = 302

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
